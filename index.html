function makeGames(){
  const arr=[], seen=new Set();
  const add=(name,size,year,genre)=>{
    if(seen.has(name)||arr.length>=650)return;
    seen.add(name);
    const cover=COVERS[name]||"";
    arr.push({id:arr.length+1,code:`XD-${String(arr.length+1).padStart(4,"0")}`,name,size,releaseYear:year,genre,cover,
      description:`${name} یک تجربه ${genre} شناخته‌شده است. این رکورد برای مدیریت کتابخانه شخصی XD Player ثبت شده و اطلاعات حجم، سال انتشار و ژانر آن در کارت بازی نمایش داده می‌شود.`});
  };
  BASE_GAMES.forEach(x=>add(...x));
  MORE_NAMES.forEach((n,i)=>{
    const info=EXTRA_INFO[n]||[Math.max(2,Math.round((n.length*3.7+i*1.7)%118*10)/10),1998+((i*7)%28),"Action / Adventure"];
    add(n,...info);
  });
  return arr;
}

function applyFilters(){
  const q=query.toLowerCase();
  filtered=GAMES.filter(g=>(activeGenre==="همه"||g.genre.toLowerCase().includes(activeGenre.toLowerCase()))&&(g.name.toLowerCase().includes(q)||g.code.toLowerCase().includes(q)||g.genre.toLowerCase().includes(q)));
  filtered.sort((a,b)=>{
    if(sortMode==="newest")return b.releaseYear-a.releaseYear;
    if(sortMode==="oldest")return a.releaseYear-b.releaseYear;
    if(sortMode==="small")return a.size-b.size;
    if(sortMode==="large")return b.size-a.size;
    return a.name.localeCompare(b.name);
  });
}

function renderCards(reset=false){
  if(reset){applyFilters();renderIndex=0}
  const grid=$("#gameGrid");if(!grid)return;
  if(!filtered.length){grid.innerHTML=`<div class="glass empty" style="grid-column:1/-1">نتیجه‌ای پیدا نشد.</div>`;return}
  if(reset)grid.innerHTML="";
  if(renderTimer)clearTimeout(renderTimer);
  const batch=18, slice=filtered.slice(renderIndex,renderIndex+batch);
  grid.insertAdjacentHTML("beforeend",slice.map(cardHTML).join(""));
  renderIndex+=slice.length;
  requestAnimationFrame(()=>observeCards(grid));
  if(renderIndex<filtered.length)renderTimer=setTimeout(()=>renderCards(false),30);
}
function cardHTML(g){
  const chosen=currentUser().selected.includes(g.id);
  return `<article class="glass card" data-id="${g.id}">
    ${chosen?`<div class="selected-tag">✓ انتخاب شده</div>`:""}${imgFor(g)}
    <div class="card-body"><h3>${esc(g.name)}</h3><div class="meta"><span>کد: <b>${g.code}</b></span><span>حجم: <b>${fmt(g.size)} GB</b></span><span>سال: <b>${g.releaseYear}</b></span><span>${esc(g.genre)}</span></div>
    <div class="card-actions"><button class="btn ${chosen?"danger":"primary"}" onclick="toggleGame(${g.id})">${chosen?"❌ حذف":"➕ افزودن"}</button><button class="btn ghost" onclick="openDetail(${g.id})">جزئیات</button></div></div>
  </article>`;
}
let cardObserver;
function observeCards(root){
  cardObserver?.disconnect();
  cardObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add("visible");cardObserver.unobserve(e.target)}}),{rootMargin:"80px"});
  $$(".card",root).forEach(c=>cardObserver.observe(c));
}

function renderVault(){

  <div class="section-head"><div><h2>${SITE_CONFIG.vaultTitle}</h2><div class="muted">${u.selected.length} بازی انتخاب شده</div></div>${u.selected.length?`<button class="btn primary" onclick="downloadList()">📥 ${esc(SITE_CONFIG.downloadTitle)}</button>`:""}</div>

  ${pct>=90?`<div class="toast warning" style="margin-top:14px;animation:none">⚠️ هشدار: فضای ذخیره‌سازی شما رو به اتمام است!</div>`:""}
  <div class="suggestions"><h4>پیشنهاد هوشمند</h4>${near.length?near.map(g=>`<div class="suggestion">${esc(g.name)} <span>${fmt(g.size)} GB</span></div>`).join(""):`<div class="muted small">بازی مناسبی با فضای فعلی پیدا نشد.</div>`}</div>
  </aside></div></div></section>`;
  animateNumber($("#usedCounter"),0,use);
  $$(".card").forEach(x=>x.classList.add("visible"));
}
function animateNumber(el,from,to){
  if(!el)return;const start=performance.now(),dur=650;
  function tick(now){const p=Math.min(1,(now-start)/dur),e=1-Math.pow(1-p,3);el.textContent=`${fmt(from+(to-from)*e)} GB`;if(p<1)requestAnimationFrame(tick)}
  requestAnimationFrame(tick);
}
function toggleGame(id){
  const u=currentUser(),g=GAMES.find(x=>x.id===id);if(!g)return;
  if(u.selected.includes(id)){u.selected=u.selected.filter(x=>x!==id);persistUser(u);toast(`${g.name} از بازی‌های شما حذف شد.`,"info");render();return}
  const c=CONSOLES.find(x=>x.id===u.console)||CONSOLES[0],next=used(u)+g.size;
  if(next>c.capacity){toast("⛔ خطا! فضای کافی برای این بازی وجود ندارد. لطفاً یک بازی را حذف کنید.","error");return}
  u.selected.push(id);persistUser(u);toast(`${g.name} به بازی‌های شما اضافه شد.`,"success");render();
}

/* ---------- ساخت PNG بدون کتابخانه خارجی ---------- */
function downloadList(){
 const u=currentUser();if(!u.selected.length)return toast("ابتدا حداقل یک بازی اضافه کنید.","warning");
 const c=document.createElement("canvas"),ctx=c.getContext("2d"),W=1200,H=Math.max(520,220+u.selected.length*58);
 c.width=W;c.height=H;ctx.fillStyle="#0A0A0A";ctx.fillRect(0,0,W,H);
 const grad=ctx.createLinearGradient(0,0,W,H);grad.addColorStop(0,"#0E7A0E");grad.addColorStop(.45,"#0A0A0A");grad.addColorStop(1,"#111");ctx.globalAlpha=.24;ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
 ctx.strokeStyle="#39FF5A";ctx.lineWidth=2;ctx.strokeRect(28,28,W-56,H-56);
 ctx.fillStyle="#39FF5A";ctx.font="800 42px Orbitron";ctx.textAlign="left";ctx.fillText("XD PLAYER",65,92);
 ctx.fillStyle="#fff";ctx.font="700 28px Exo 2";ctx.fillText("بازی‌های انتخاب‌شده من",65,140);
 ctx.font="500 22px Exo 2";u.selected.map(id=>GAMES.find(g=>g.id===id)).filter(Boolean).forEach((g,i)=>{const y=205+i*58;ctx.fillStyle="#A7A7A7";ctx.fillText(`${g.code} | ${g.name}`,65,y)});
 ctx.fillStyle="#69736c";ctx.font="16px Exo 2";ctx.fillText(`${u.selected.length} games • ${fmt(used(u))} GB`,65,H-48);
 const a=document.createElement("a");a.download="XD_Player_Game_List.png";a.href=c.toDataURL("image/png");a.click();toast("تصویر لیست بازی‌ها ساخته و دانلود شد.","success");
}

/* ---------- Particle Background سبک ---------- */
(function particles(){
 const cv=$("#particles"),ctx=cv.getContext("2d"),DPR=Math.min(devicePixelRatio||1,1.5);let pts=[],mx=-9999,my=-9999,w,h;
 function resize(){w=innerWidth;h=innerHeight;cv.width=w*DPR;cv.height=h*DPR;cv.style.width=w+"px";cv.style.height=h+"px";ctx.setTransform(DPR,0,0,DPR,0,0);const n=innerWidth<700?28:55;pts=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:Math.random()*1.2+.3}))}
 addEventListener("resize",resize,{passive:true});addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY},{passive:true});resize();
 function loop(){ctx.clearRect(0,0,w,h);for(const p of pts){const dx=mx-p.x,dy=my-p.y,d=Math.hypot(dx,dy);if(d<130){p.vx+=dx/d*.003;p.vy+=dy/d*.003}p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.fillStyle="rgba(57,255,90,.28)";ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(loop)}
 loop();
})();

/* ---------- IntersectionObserver برای Lazy Render ---------- */
if("IntersectionObserver" in window){const lazy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const img=e.target;if(img.dataset.src){img.src=img.dataset.src;delete img.dataset.src}lazy.unobserve(img)}}),{rootMargin:"200px"});window.observeLazy=()=>$$("img[data-src]").forEach(x=>lazy.observe(x))}

/* ---------- شروع برنامه ---------- */
if(session?.userId&&!currentUser()){session=null;localStorage.removeItem(idKey("session"))}
render();
</script>
